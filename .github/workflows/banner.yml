name: banner
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/generate_banner.py'
      - '.github/workflows/banner.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate
        run: python scripts/generate_banner.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/banner-light.svg assets/banner-dark.svg
          git diff --cached --quiet || git commit -m "chore 自动生成 banner"
          git push
