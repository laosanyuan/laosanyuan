<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">一刀</title>
  <desc id="desc">个人主页横幅：头像、名字与技术栈</desc>

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#E8E0D3" opacity="0.8"/>
    </pattern>
    <pattern id="halftone" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.35" fill="#F5F0E7"/>
      <circle cx="13" cy="4" r="1.9" fill="#F5F0E7"/>
      <circle cx="4" cy="13" r="1.9" fill="#F5F0E7"/>
      <circle cx="13" cy="13" r="1.35" fill="#F5F0E7"/>
    </pattern>
    <clipPath id="sphere"><circle cx="1100" cy="180" r="250"/></clipPath>
    <clipPath id="avatar"><circle cx="154" cy="182" r="86"/></clipPath>
  </defs>

  <rect width="1200" height="360" fill="#F5F0E7"/>
  <rect width="1200" height="360" fill="url(#grid)"/>

  <g clip-path="url(#sphere)">
    <circle cx="1100" cy="180" r="250" fill="#D23A2A"/>
    <circle cx="1100" cy="180" r="250" fill="url(#halftone)"/>
  </g>
  <circle cx="1100" cy="180" r="250" fill="none" stroke="#F5F0E7" stroke-width="2"/>

  <circle cx="161" cy="191" r="88" fill="#D23A2A" opacity="0.22"/>
  <circle cx="154" cy="182" r="94" fill="#F5F0E7"/>
  <image x="68" y="96" width="172" height="172" preserveAspectRatio="xMidYMid slice" clip-path="url(#avatar)" xlink:href="data:image/jpeg;base64,"/>
  <circle cx="154" cy="182" r="94" fill="none" stroke="#161616" stroke-width="2"/>

  <rect x="272" y="103" width="44" height="5" rx="2.5" fill="#D23A2A"/>

  <text x="277" y="193" font-family="'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="86" font-weight="700" letter-spacing="6" fill="#D23A2A" opacity="0.22">一刀</text>
  <text x="272" y="188" font-family="'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="86" font-weight="700" letter-spacing="6" fill="#161616">一刀</text>

  <text x="276" y="232" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="400" letter-spacing="1" fill="#6E655A">C# / .NET · Flutter · Rust · Python</text>
  <text x="276" y="272" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="500" letter-spacing="1.6" fill="#8E8578">HANGZHOU · yhonglai@163.com</text>
  <line x1="276" y1="302" x2="820" y2="302" stroke="#D8CFC0" stroke-width="1"/>
</svg>
