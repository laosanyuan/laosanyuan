<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">一刀</title>
  <desc id="desc">个人主页横幅：印章、名字与项目排期网络示意</desc>

  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#232830" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="#0E1013"/>
  <rect width="1200" height="320" fill="url(#dots)"/>


  <!-- 四角裁切线 -->
  <g fill="none" stroke="#3A4048" stroke-width="1" opacity="0.9">
    <path d="M24 44 V24 H44"/>
    <path d="M1156 24 H1176 V44"/>
    <path d="M24 276 V296 H44"/>
    <path d="M1156 296 H1176 V276"/>
  </g>

  <!-- 印章 -->
  <rect x="80" y="128" width="60" height="60" rx="6" fill="#E2603F"/>
  <text x="110" y="170" text-anchor="middle"
        font-family="'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif"
        font-size="34" font-weight="700" fill="#1A0F0A">刀</text>

  <!-- 名字 -->
  <text x="164" y="188"
        font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif"
        font-size="76" font-weight="700" letter-spacing="4" fill="#F2EFE8">一刀</text>

  <text x="166" y="226"
        font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="19" font-weight="500" letter-spacing="1.5" fill="#A8A399">C# / .NET · Flutter · Rust · Python</text>

  <text x="166" y="258"
        font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="11" font-weight="500" letter-spacing="3.5" fill="#6E747C">HANGZHOU</text>

  <!-- 项目网络示意 -->
  <g stroke-linecap="round">
    <path d="M680 160 L790 100" fill="none" stroke="#2A3037" stroke-width="1.5"/>
    <path d="M680 160 L790 220" fill="none" stroke="#2A3037" stroke-width="1.5"/>
    <path d="M790 100 L900 160" fill="none" stroke="#E2603F" stroke-width="2"/>
    <path d="M790 220 L900 160" fill="none" stroke="#E2603F" stroke-width="2"/>
    <path d="M900 160 L1010 100" fill="none" stroke="#2A3037" stroke-width="1.5"/>
    <path d="M900 160 L1010 220" fill="none" stroke="#2A3037" stroke-width="1.5"/>
    <path d="M1010 100 L1120 160" fill="none" stroke="#2A3037" stroke-width="1.5"/>
    <path d="M1010 220 L1120 160" fill="none" stroke="#2A3037" stroke-width="1.5"/>
  </g>

  <g>
    <circle cx="680" cy="160" r="6" fill="#0E1013" stroke="#E8E4DA" stroke-width="2"/>
    <circle cx="790" cy="100" r="4.5" fill="#E8E4DA"/>
    <circle cx="790" cy="220" r="4.5" fill="#E8E4DA"/>
    <circle cx="1010" cy="100" r="4.5" fill="#E8E4DA"/>
    <circle cx="1010" cy="220" r="4.5" fill="#E8E4DA"/>
    <circle cx="1120" cy="160" r="6" fill="#0E1013" stroke="#E8E4DA" stroke-width="2"/>
  </g>

  <circle cx="900" cy="160" r="14" fill="none" stroke="#E2603F" stroke-opacity="0.3" stroke-width="1.5"/>
  <circle cx="900" cy="160" r="7" fill="#E2603F"/>

  <text x="680" y="272"
        font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="11" font-weight="500" letter-spacing="4" fill="#6E747C">PERT / 寸进</text>
</svg>
